version: '3.8'

services:
  elasticsearch:
    image: elasticsearch:8.12.2 # 推荐使用特定版本，保持稳定
    build: .
    container_name: elasticsearch
    environment:
      # ⚠️ 1. 禁用安全功能 (开发环境推荐，避免复杂的证书和密码配置)
      - xpack.security.enabled=false
      # 2. 禁用 TLS/SSL (如果不禁用，客户端连接会失败)
      - xpack.security.transport.ssl.enabled=false
      # 3. 单节点模式 (开发模式必须)
      - discovery.type=single-node
      # 4. 限制内存 (避免在 Docker Desktop/低内存机器上占用过多资源)
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      # 5. 允许单节点集群名称
      - cluster.name=es-cluster

    ulimits:
      # 内存锁定配置，防止内存交换，提高性能
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data # 数据持久化
    ports:
      - 9200:9200 # HTTP API 端口
      - 9300:9300 # 节点间通信端口
    networks:
      - elastic
    restart: always

  kibana:
    image: kibana:8.12.2 # ⚠️ 必须和 Elasticsearch 使用相同的版本
    container_name: kibana
    environment:
      # Kibana 配置，指向 Elasticsearch 容器的地址和端口
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # 禁用安全，以便连接未启用安全功能的 ES
      - KIBANA_PROBE_CLUSTER_SECURITY=false
    ports:
      - 5601:5601 # Kibana Web UI 端口
    networks:
      - elastic
    depends_on:
      - elasticsearch
    restart: always

volumes:
  esdata:
    driver: local

networks:
  elastic:
    driver: bridge