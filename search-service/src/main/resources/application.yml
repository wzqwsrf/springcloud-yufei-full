server:
  port: 8098

spring:

  application:
    name: search-service
  # 推荐使用 Spring Data Elasticsearch 的新配置结构
  elasticsearch:
    uris: http://localhost:9200
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:mysql://localhost:3306/app?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

    redis:
      host: localhost
      port: 6379

    kafka:
      bootstrap-servers: localhost:9092
